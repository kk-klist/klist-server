server:
  port: 1234

spring:
  application:
    name: klist

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=15m

  security:
    oauth2:
      client:
        registration:
          kakao:
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
          google:
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

weather:
  api:
    base-url: https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0

tour:
  api:
    base-url: https://apis.data.go.kr/B551011
    service-key: ${TOUR_SERVICE_KEY:}
    mobile-app: KlistPlus

kakao:
  rest-key: ${KAKAO_REST_KEY:}
  admin-key: ${KAKAO_ADMIN_KEY:}
  local:
    base-url: https://dapi.kakao.com
  mobility:
    base-url: https://apis-navi.kakaomobility.com

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

oauth:
  client-redirect-uri: ${OAUTH_CLIENT_REDIRECT_URI:http://localhost:5173/oauth/callback}

chatbot:
  base-url: ${CHATBOT_BASE_URL:http://localhost:8081}
  internal-api-key: ${INTERNAL_API_KEY:}
  timeout-ms: ${CHATBOT_HTTP_TIMEOUT_MS:35000}
